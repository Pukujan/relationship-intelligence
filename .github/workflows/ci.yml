name: CI

# The required check is the single aggregate job named `gates`. Every real job
# feeds it, so a job that is not wired in cannot silently skip the gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  planning:
    name: Planning, ontology, and continuity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out the release train
        uses: actions/checkout@v4
        with:
          repository: Pukujan/agent-stack-train
          ref: main
          path: .stack-train
      - name: Install pinned validator and continuity dependencies
        run: |
          python -m pip install --requirement .oio/requirements.txt
          python -m pip install --editable .stack-train/pcm
      - name: Verify the installed OIO package
        run: python .github/scripts/oio_installer.py --target "$GITHUB_WORKSPACE" --check
      - name: Validate project contracts and issue packets
        run: python scripts/validate_planning.py
      - name: Validate continuity state
        run: continuity validate --root "$GITHUB_WORKSPACE"
      - name: Check committed files for credential-shaped values
        shell: bash
        run: |
          if git grep -nE 'octo_live_(ws|acc)_[0-9a-f]{24,}|sk-[A-Za-z0-9_-]{20,}' -- ':!.env.example'; then
            echo "Credential-shaped value committed; rotate it and remove it from history."
            exit 1
          fi

  train:
    name: Manifest agrees with the release train
    uses: Pukujan/agent-stack-train/.github/workflows/check-adopter.yml@main
    with:
      manifest: stack-manifest.json
      claude: warn

  app:
    name: Application types, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install application dependencies
        run: pnpm install --dir app --frozen-lockfile
      - name: Type-check
        run: |
          pnpm --dir app exec tsc --noEmit -p tsconfig.app.json
          pnpm --dir app exec tsc --noEmit -p tsconfig.server.json
      - name: Lint
        run: pnpm --dir app exec biome check src server shared tests
      - name: Contract tests
        run: pnpm --dir app exec vitest run
      - name: Build
        run: pnpm --dir app exec vite build

  gates:
    name: gates
    if: always()
    needs: [planning, train, app]
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs green
        run: |
          set -euo pipefail
          test "${{ needs.planning.result }}" = "success"
          test "${{ needs.train.result }}" = "success"
          test "${{ needs.app.result }}" = "success"
          echo "All required upstream jobs passed."
