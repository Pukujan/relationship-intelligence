name: CI

# The required check is the single aggregate job named `gates`. Every real job
# feeds it, so a job that is not wired in cannot silently skip the gate.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  planning:
    name: Planning, ontology, and continuity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out the release train
        uses: actions/checkout@v4
        with:
          repository: Pukujan/agent-stack-train
          ref: main
          path: .stack-train
      - name: Install pinned validator and continuity dependencies
        run: |
          python -m pip install --requirement .oio/requirements.txt
          python -m pip install --editable .stack-train/pcm
      - name: Verify the installed OIO package
        run: python .github/scripts/oio_installer.py --target "$GITHUB_WORKSPACE" --check
      - name: Validate project contracts and issue packets
        run: python scripts/validate_planning.py
      - name: Validate continuity state
        run: continuity validate --root "$GITHUB_WORKSPACE"
      - name: Check committed files for credential-shaped values
        shell: bash
        run: |
          if git grep -nE 'octo_live_(ws|acc)_[0-9a-f]{24,}|sk-[A-Za-z0-9_-]{20,}' -- ':!.env.example'; then
            echo "Credential-shaped value committed; rotate it and remove it from history."
            exit 1
          fi

  train:
    name: Manifest agrees with the release train
    uses: Pukujan/agent-stack-train/.github/workflows/check-adopter.yml@main
    with:
      manifest: stack-manifest.json
      claude: warn

  app:
    name: Application types, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install application dependencies
        run: pnpm install --dir app --frozen-lockfile
      - name: Type-check
        run: |
          pnpm --dir app exec tsc --noEmit -p tsconfig.app.json
          pnpm --dir app exec tsc --noEmit -p tsconfig.server.json
      - name: Lint
        run: pnpm --dir app exec biome check src server shared tests
      - name: Contract tests
        run: pnpm --dir app exec vitest run
      - name: Build
        run: pnpm --dir app run build

  console:
    name: Console types, lint, machines, orphans and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Install console dependencies
        run: pnpm install --dir console --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir console typecheck
      - name: Lint
        run: pnpm --dir console exec eslint .
      - name: Machine contracts
        run: pnpm --dir console test:machines
      - name: Orphan check
        run: node console/scripts/check-orphans.mjs
      - name: Build
        run: pnpm --dir console build

  gates:
    name: gates
    if: always()
    needs: [planning, train, app, console]
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs green
        run: |
          set -euo pipefail
          test "${{ needs.planning.result }}" = "success"
          test "${{ needs.train.result }}" = "success"
          test "${{ needs.app.result }}" = "success"
          test "${{ needs.console.result }}" = "success"
          echo "All required upstream jobs passed."

  auto-merge:
    name: Arm auto-merge
    if: github.event_name == 'pull_request' && github.actor == 'Pukujan'
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
      - name: After the merge lands, check the live hostname
        if: vars.RI_PUBLIC_URL != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          URL: ${{ vars.RI_PUBLIC_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            state=$(gh pr view "$PR_URL" --json state --jq .state)
            [ "$state" = "MERGED" ] && break
            sleep 5
          done
          [ "$state" = "MERGED" ] || { echo "PR not merged yet; skipping live check"; exit 0; }
          curl -fsS --retry 12 --retry-delay 20 "$URL/app-api/health" | grep -q '"status":"ok"'
          curl -fsS "$URL/console/" | grep -q '<div id="root"'
          echo "Live console and adapter healthy at $URL after merge"
