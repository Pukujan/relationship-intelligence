name: OIO close on merge

# Installed by OIO's installer; rerun it from a newer OIO checkout to move the
# pin instead of editing this file. Closes the issue logs a merged pull request
# names with Closes, Fixes or Resolves.

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    uses: Pukujan/observational-issue-ops/.github/workflows/close-on-merge.yml@c36e174efa057fec90cb4801d50a72a2188ebb21
    with:
      oio_ref: c36e174efa057fec90cb4801d50a72a2188ebb21
    secrets:
      CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
